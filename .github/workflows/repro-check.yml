name: Repro Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  evaluation:
    runs-on: ubuntu-latest
    env:
      IOTMEDIATOR_REAL_INTEGRATION: "false"
      SESSION_SECRET: "ci-session-secret-for-replay-only"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run replay evaluation
        run: npm run sim:eval
